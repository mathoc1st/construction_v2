services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: postgres://construction_user:construction_password@postgres:5432/construction_production
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs
      - ../uploads:/app/uploads
    env_file:
      - .env.production
    networks:
      - construction

  postgres:
    image: postgres:17
    container_name: construction-postgres
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - construction

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - /var/opt/pgbackups:/backups
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=construction
      - POSTGRES_USER=construction_user
      - POSTGRES_PASSWORD=construction_password
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_WEEKS=2
      - HEALTHCHECK_PORT=8080
    networks:
      - construction

volumes:
  pgdata:

networks:
  construction:
    driver: bridge
